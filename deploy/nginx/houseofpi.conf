# HouseOfPi: nginx terminates TLS on :5000 and proxies to Flask on localhost.
# Installed to /etc/nginx/sites-available/houseofpi (symlinked from sites-enabled).
# Setup, verification and rollback: deploy/nginx/README.md
#
# Why: Werkzeug's dev server does the TLS handshake on its single accept thread
# with no timeout, so one idle client (e.g. an internet scanner) froze the whole
# app until it was restarted. nginx handles slow or idle clients per connection
# and drops them after the timeouts below.

# $request_time / $upstream_response_time show how long real requests take,
# which is what MyHouse's client timeouts (2s connect / 5s read) are sized against.
log_format houseofpi_timing '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                            'rt=$request_time urt=$upstream_response_time "$http_user_agent"';

server {
    listen 5000 ssl;
    server_name _;

    # The stable copies in ~/certs, not the per-deploy copies in ~/HouseOfPi (the deploy wipes that dir).
    # server.csr is actually the certificate; MyHouse pins it in its truststore.
    ssl_certificate     /home/pi/certs/server.csr;
    ssl_certificate_key /home/pi/certs/server.key;

    # client_header_timeout also bounds the TLS handshake: idle clients are dropped after 10s.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;

    access_log /var/log/nginx/houseofpi.access.log houseofpi_timing;
    error_log  /var/log/nginx/houseofpi.error.log;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        # Longer than MyHouse waits (5s), so a slow-but-working request still completes on the Pi.
        proxy_read_timeout    30s;
    }
}
